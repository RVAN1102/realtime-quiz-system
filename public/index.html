<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-base-300 min-h-screen flex items-center justify-center p-4">
  <main class="card w-full max-w-md bg-base-100 shadow-2xl border border-white/10">
    <div class="card-body gap-5">
      <div class="text-center space-y-3">
        <div class="mx-auto w-16 h-16 rounded-2xl bg-primary/15 flex items-center justify-center">
          <i data-lucide="shield-check" class="w-9 h-9 text-primary"></i>
        </div>
        <div>
          <h1 class="text-3xl font-black">QUIZ ADMIN</h1>
          <p class="text-base-content/60">Đăng nhập để tạo đề và quản lý bài nộp realtime</p>
        </div>
      </div>

      <label class="form-control">
        <div class="label"><span class="label-text">Mật khẩu quản trị</span></div>
        <input id="password" type="password" class="input input-bordered" placeholder="Mặc định: 123456" autocomplete="current-password" />
      </label>

      <button id="loginBtn" class="btn btn-primary w-full">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        Đăng nhập
      </button>

      <p id="msg" class="text-error text-sm min-h-5"></p>

      <div class="divider">Làm bài</div>
      <p class="text-sm text-base-content/60 text-center">
        Người làm bài dùng link đề thi từ trang quản trị, ví dụ:
        <code class="kbd kbd-sm">/thi/exam_demo_csdl</code>
      </p>
    </div>
  </main>

  <script>
    lucide.createIcons();

    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const msg = document.getElementById('msg');

    async function login() {
      msg.textContent = '';
      loginBtn.classList.add('btn-disabled');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passwordInput.value })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || 'Đăng nhập thất bại.');

        localStorage.setItem('quiz_token', data.token);
        window.location.href = '/admin';
      } catch (err) {
        msg.textContent = err.message;
      } finally {
        loginBtn.classList.remove('btn-disabled');
      }
    }

    loginBtn.addEventListener('click', login);
    passwordInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') login();
    });
  </script>
</body>
</html>
