<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Làm bài trắc nghiệm</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-base-200 min-h-screen">
  <div class="container mx-auto p-4 lg:p-8">
    <header class="mb-6">
      <div class="breadcrumbs text-sm">
        <ul>
          <li>Realtime Quiz</li>
          <li id="examTitleCrumb">Đang tải đề</li>
        </ul>
      </div>
      <h1 id="examTitle" class="text-3xl lg:text-4xl font-black">Đang tải đề thi...</h1>
      <p id="examDescription" class="text-base-content/60 mt-2"></p>
    </header>

    <section id="studentBox" class="card bg-base-100 shadow-xl border border-base-300 mb-6">
      <div class="card-body">
        <h2 class="card-title"><i data-lucide="user-pen"></i> Thông tin người làm bài</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <label class="form-control md:col-span-2">
            <div class="label"><span class="label-text">Họ tên <span class="text-error">*</span></span></div>
            <input id="studentName" class="input input-bordered" placeholder="Nhập họ tên" />
          </label>
          <label class="form-control">
            <div class="label"><span class="label-text">Mã số / lớp</span></div>
            <input id="studentCode" class="input input-bordered" placeholder="Không bắt buộc" />
          </label>
        </div>
      </div>
    </section>

    <main class="quiz-shell">
      <section id="questionsRoot" class="space-y-5"></section>

      <aside class="quiz-sidebar">
        <div class="card bg-base-100 shadow-2xl border border-base-300">
          <div class="card-body gap-5">
            <div>
              <div class="text-sm text-base-content/60">Thời gian còn lại</div>
              <div id="timer" class="text-5xl font-black text-primary tabular-nums">--:--</div>
              <progress id="timeProgress" class="progress progress-primary w-full mt-3" value="100" max="100"></progress>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div class="stat bg-base-200 rounded-2xl p-4">
                <div class="stat-title text-xs">Đã làm</div>
                <div id="answeredCount" class="stat-value text-2xl">0</div>
              </div>
              <div class="stat bg-base-200 rounded-2xl p-4">
                <div class="stat-title text-xs">Tổng câu</div>
                <div id="totalCount" class="stat-value text-2xl">0</div>
              </div>
            </div>

            <div>
              <div class="flex justify-between text-sm mb-2">
                <span>Tiến độ</span>
                <span id="progressText">0%</span>
              </div>
              <progress id="answerProgress" class="progress progress-success w-full" value="0" max="100"></progress>
            </div>

            <div id="questionNavigator" class="grid grid-cols-5 gap-2"></div>

            <button id="submitBtn" class="btn btn-primary btn-lg w-full">
              <i data-lucide="send" class="w-5 h-5"></i>
              Nộp bài
            </button>
            <p id="submitMsg" class="text-sm min-h-5"></p>
          </div>
        </div>

        <div id="resultBox" class="card bg-base-100 shadow-xl border border-base-300 mt-4 hidden">
          <div class="card-body">
            <h2 class="card-title"><i data-lucide="badge-check"></i> Kết quả</h2>
            <div id="resultSummary" class="space-y-2"></div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="/js/exam.js"></script>
</body>
</html>
