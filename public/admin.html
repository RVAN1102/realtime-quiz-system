<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-base-300 min-h-screen font-sans">
  <div class="container mx-auto p-4 lg:p-8">
    <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-8">
      <div>
        <h1 class="text-4xl font-black text-white flex items-center gap-3">
          <i data-lucide="layout-dashboard" class="text-primary w-10 h-10"></i>
          QUIZ ADMIN
        </h1>
        <p class="text-base-content/60">Quản lý đề thi, bài nộp và kết quả theo thời gian thực</p>
      </div>
      <div class="flex flex-wrap gap-3">
        <a href="/tao-de" class="btn btn-primary">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          Tạo đề thi
        </a>
        <button id="refreshBtn" class="btn btn-ghost">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Làm mới
        </button>
        <button id="logoutBtn" class="btn btn-ghost text-error">Đăng xuất</button>
      </div>
    </header>

    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="stat bg-base-100 rounded-2xl shadow-xl border border-white/10">
        <div class="stat-figure text-primary"><i data-lucide="file-question" class="w-8 h-8"></i></div>
        <div class="stat-title">Số đề thi</div>
        <div id="examCount" class="stat-value">0</div>
      </div>
      <div class="stat bg-base-100 rounded-2xl shadow-xl border border-white/10">
        <div class="stat-figure text-secondary"><i data-lucide="send" class="w-8 h-8"></i></div>
        <div class="stat-title">Bài đã nộp</div>
        <div id="submissionCount" class="stat-value">0</div>
      </div>
      <div class="stat bg-base-100 rounded-2xl shadow-xl border border-white/10">
        <div class="stat-figure text-success"><i data-lucide="target" class="w-8 h-8"></i></div>
        <div class="stat-title">Tỷ lệ đúng TB</div>
        <div id="averageScore" class="stat-value">0%</div>
      </div>
    </section>

    <div id="realtimeAlert" class="alert alert-success shadow-lg mb-6 hidden">
      <i data-lucide="radio" class="w-5 h-5"></i>
      <span id="realtimeAlertText">Có bài nộp mới.</span>
    </div>

    <section class="grid grid-cols-1 xl:grid-cols-5 gap-6">
      <div class="xl:col-span-2 card bg-base-100 shadow-2xl border border-white/10">
        <div class="card-body">
          <div class="flex items-center justify-between mb-2">
            <h2 class="card-title"><i data-lucide="clipboard-list"></i> Danh sách đề thi</h2>
            <span class="badge badge-outline">Public link</span>
          </div>
          <div id="examList" class="space-y-3"></div>
        </div>
      </div>

      <div class="xl:col-span-3 card bg-base-100 shadow-2xl border border-white/10">
        <div class="card-body">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-2">
            <h2 class="card-title"><i data-lucide="history"></i> Quản lý thời gian nộp bài</h2>
            <input id="submissionSearch" class="input input-bordered input-sm w-full md:w-72" placeholder="Tìm tên, mã SV, tên đề..." />
          </div>

          <div class="overflow-x-auto">
            <table class="table table-zebra">
              <thead>
                <tr>
                  <th>Thời gian nộp</th>
                  <th>Người làm</th>
                  <th>Đề thi</th>
                  <th>Kết quả</th>
                  <th>Thời gian làm</th>
                  <th>Chi tiết</th>
                </tr>
              </thead>
              <tbody id="submissionsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </div>

  <dialog id="detailModal" class="modal">
    <div class="modal-box w-11/12 max-w-5xl">
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
      </form>
      <h3 class="font-bold text-2xl mb-2">Chi tiết bài nộp</h3>
      <div id="submissionDetail" class="space-y-4"></div>
    </div>
  </dialog>

  <script src="/js/admin.js"></script>
</body>
</html>
